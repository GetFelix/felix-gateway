name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The crate packages
        run: cargo package --locked -p felix-gateway

  gateway-felix:
    name: Gateway against Felix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --locked --no-run
      - name: Start Felix
        run: dev/up.sh
      - name: Integration tests
        env:
          GATEWAY_TENANT: demo
          GATEWAY_OIDC_CLIENT_ID: felix-gateway
        run: |
          export GATEWAY_FELIX_CA_FILE="$PWD/dev/state/broker-cert.pem"
          export GATEWAY_SCOPE_FILE="$PWD/dev/scope.toml"
          cargo test --locked --test relay -- --include-ignored --nocapture
      # The same suite over shared connections, against the broker that binds
      # tokens to client certificates. The skipped test connects without a
      # certificate on purpose.
      - name: Integration tests over shared connections
        env:
          GATEWAY_TENANT: demo
          GATEWAY_OIDC_CLIENT_ID: felix-gateway
          GATEWAY_FELIX_BROKERS: 127.0.0.1:5001
        run: |
          export GATEWAY_FELIX_CA_FILE="$PWD/dev/state/ca.pem"
          export GATEWAY_FELIX_CREDENTIAL_FILE="$PWD/dev/state/gateway.token"
          export GATEWAY_FELIX_CLIENT_CERT="$PWD/dev/state/gateway-cert.pem"
          export GATEWAY_FELIX_CLIENT_KEY="$PWD/dev/state/gateway-key.pem"
          export GATEWAY_SCOPE_FILE="$PWD/dev/scope.toml"
          cargo test --locked --test relay -- --include-ignored --nocapture \
            --skip a_token_for_one_room_cannot_reach_another_at_the_broker
      - name: Felix logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Every lockfile entry comes from npmjs with a sha512 hash
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages)
              .filter(([path, entry]) => path.includes("node_modules/") && !entry.link)
              .filter(([, entry]) =>
                !entry.resolved?.startsWith("https://registry.npmjs.org/") ||
                !entry.integrity?.startsWith("sha512-"));
            for (const [path, entry] of bad) console.error(path, entry.resolved, entry.integrity);
            process.exit(bad.length ? 1 : 0);
          '
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: The package packs
        run: npm pack --dry-run -w felix-gateway-client

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: felix-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The binary starts and reads its scope file
        run: |
          docker run -d --name gateway -p 8787:8787 \
            -e GATEWAY_TENANT=demo -e GATEWAY_OIDC_CLIENT_ID=felix-gateway \
            -v "$PWD/dev/scope.toml:/etc/felix-gateway/scope.toml:ro" felix-gateway:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/oidc && exit 0
            sleep 1
          done
          docker logs gateway
          exit 1
