# Felix for local development and CI: a control plane, two brokers, a
# stand-in IdP, and a one-shot seed that creates the rooms in dev/scope.toml,
# their members, the brokers' credential and the gateway's.
# `dev/up.sh` makes the certificates, starts it and waits until the brokers
# are ready.
#
# `broker` serves any client. `broker-mtls` asks for a client certificate and
# binds tokens to it, which is what shared connections need; its per-user
# subscription cap is small so the tests can reach it.
name: felix-gateway

services:
  idp:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/idp.mjs"]
    environment:
      # Browsers sign in on the host, so the issuer is the host's address.
      IDP_ISSUER: http://127.0.0.1:9400
    ports:
      - "127.0.0.1:9400:9400"
    volumes:
      - ./idp.mjs:/app/idp.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9400/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  controlplane:
    image: ghcr.io/getfelix/felix-controlplane:0.6.0-preview.5
    environment:
      # In-memory store: a restart of the stack starts from nothing.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: dev-bootstrap
      # The dev IdP is plain HTTP on the compose network.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      # The seed writes the broker one token and nothing refreshes it, so the
      # default 15 minutes would end a dev session early. Session tokens refresh.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      idp:
        condition: service_healthy

  seed:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/seed.mjs"]
    volumes:
      - ./seed.mjs:/app/seed.mjs:ro
      - ./state:/state
    depends_on:
      controlplane:
        condition: service_healthy

  broker:
    image: ghcr.io/getfelix/felix-broker:0.6.0-preview.5
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT_EXPORT: /state/broker-cert.pem
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      # Acknowledge after the write, so acks carry the record's log offset.
      FELIX_ACK_ON_COMMIT: "true"
      # Small delivery batches: browsers want latency, not throughput.
      FELIX_EVENT_BATCH_MAX_EVENTS: "8"
      FELIX_EVENT_BATCH_MAX_DELAY_US: "100"
      FELIX_FANOUT_BATCH: "8"
      # The writer queue is per connection, not per subscription, and one
      # change is one entry for each subscription on the connection. At the
      # default of 64, a client holding 100 subscriptions on one connection
      # loses changes at any rate.
      FELIX_SUB_QUEUE_BOUND: "8192"
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state
      - felix-data:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

  broker-mtls:
    image: ghcr.io/getfelix/felix-broker:0.6.0-preview.5
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT: /state/broker-mtls-cert.pem
      FELIX_TLS_KEY: /state/broker-mtls-key.pem
      FELIX_TLS_CLIENT_CA: /state/ca.pem
      FELIX_TLS_CLIENT_CERT_BIND_SUBJECT: "true"
      FELIX_MAX_SUBSCRIPTIONS_PER_CONN: "6"
      FELIX_MAX_SUBSCRIPTIONS_PER_CONN_TOTAL: "64"
      FELIX_QUIC_LISTENERS: "1"
      FELIX_ACK_ON_COMMIT: "true"
      FELIX_EVENT_BATCH_MAX_EVENTS: "8"
      FELIX_EVENT_BATCH_MAX_DELAY_US: "100"
      FELIX_FANOUT_BATCH: "8"
      FELIX_SUB_QUEUE_BOUND: "8192"
      RUST_LOG: info
    ports:
      - "127.0.0.1:5001:5000/udp"
      - "127.0.0.1:8081:8080"
    volumes:
      - ./state:/state
      - felix-data-mtls:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  felix-data:
  felix-data-mtls:
