[package]
name = "felix-gateway"
description = "A WebSocket gateway between browsers and Felix, with each connection narrowed to one scope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["felix", "websocket", "gateway", "pubsub"]
categories = ["network-programming", "web-programming::websocket"]

[lib]
name = "felix_gateway"

# The default binary: reads its settings from GATEWAY_* variables and the
# scope from GATEWAY_SCOPE_FILE.
[[bin]]
name = "felix-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
felix-client = "0.6.0-preview"
felix-wire = "0.6.0-preview"
hdrhistogram = { version = "7", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["test-util", "io-std", "io-util"] }
tokio-tungstenite = "0.29"
